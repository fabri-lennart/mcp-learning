<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="475" viewBox="0 0 1070 475" role="img" aria-labelledby="title desc"><title id="title">MCP learning architecture</title><desc id="desc">An MCP Host exchanges requests and results with an MCP Server. The server queries SQLite and receives rows.</desc><defs><marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0284c7"/></marker><marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a"/></marker></defs><rect width="1070" height="475" fill="#fff"/><text x="535" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Learning MCP: Host ↔ Server ↔ SQLite</text><text x="535" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">A learning project to connect the components and exchange data</text><rect x="48" y="178" width="250" height="164" rx="18" fill="#e0f2fe" stroke="#1e293b" stroke-width="2"/><rect x="410" y="178" width="250" height="164" rx="18" fill="#ede9fe" stroke="#1e293b" stroke-width="2"/><rect x="772" y="178" width="250" height="164" rx="18" fill="#dcfce7" stroke="#1e293b" stroke-width="2"/><g text-anchor="middle" font-family="Arial,sans-serif"><text x="173" y="240" font-size="29" font-weight="700" fill="#075985">MCP Host</text><text x="535" y="240" font-size="29" font-weight="700" fill="#5b21b6">MCP Server</text><text x="897" y="240" font-size="29" font-weight="700" fill="#166534">SQLite</text><text x="173" y="287" font-size="19" fill="#334155">Starts requests</text><text x="173" y="312" font-size="19" fill="#334155">and uses responses</text><text x="535" y="287" font-size="19" fill="#334155">Exposes tools</text><text x="535" y="312" font-size="19" fill="#334155">and handles data</text><text x="897" y="287" font-size="19" fill="#334155">Stores and returns</text><text x="897" y="312" font-size="19" fill="#334155">project data</text><text x="353" y="214" font-size="15" fill="#0369a1">MCP request</text><text x="353" y="327" font-size="15" fill="#0369a1">MCP result</text><text x="715" y="214" font-size="15" fill="#15803d">SQL query</text><text x="715" y="327" font-size="15" fill="#15803d">Rows</text><text x="535" y="405" font-size="19" fill="#334155">MCP protocol: Host ↔ Server</text><text x="535" y="443" font-size="19" fill="#334155">SQLite access: Server ↔ Database</text></g><g fill="none" stroke-width="3" stroke-linecap="round"><path d="M 302 229 H 402" stroke="#0284c7" marker-end="url(#blueArrow)"/><path d="M 406 289 H 304" stroke="#0284c7" marker-end="url(#blueArrow)"/><path d="M 664 229 H 764" stroke="#16a34a" marker-end="url(#greenArrow)"/><path d="M 768 289 H 666" stroke="#16a34a" marker-end="url(#greenArrow)"/></g></svg>